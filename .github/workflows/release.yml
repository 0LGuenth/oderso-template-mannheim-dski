name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prepare_release:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      hasNextVersion: ${{ steps.version.outputs.hasNextVersion }}
      version: ${{ steps.version.outputs.version }}
      pr_number: ${{ steps.find_pr.outputs.pr_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Get next version
        uses: thenativeweb/get-next-version@067dc4602577f4f61a51c3f4664552283a228c60
        id: version
        with:
          prefix: "v"
      - name: Find PR associated with the merge commit
        id: find_pr
        if: steps.version.outputs.hasNextVersion == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the PR associated with the current commit on `main`.
          pr_number=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number')

          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            echo "::error::Could not determine the PR number for commit ${{ github.sha }}."
            exit 1
          fi

          echo "Found PR #${pr_number} for commit ${{ github.sha }}"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

  extract_release_notes:
    name: Extract release notes
    needs: prepare_release
    if: needs.prepare_release.outputs.hasNextVersion == 'true'
    uses: ./.github/workflows/extractReleaseNotes.yml
    with:
      pr_number: ${{ needs.prepare_release.outputs.pr_number }}
      fail_if_missing: true

  release:
    name: Build PDFs and create release
    needs:
      - prepare_release
      - extract_release_notes
    if: needs.prepare_release.outputs.hasNextVersion == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install typst
        uses: typst-community/setup-typst@63ac138db421d586de61f7f5ac3bcef6a2e6c78c # v5.1.0
        with:
          typst-version: 0.15.0
      - name: Typst version
        run: typst --version
      - name: Build template PDFs
        run: |
          for file in main-*.typ; do
            echo "Compiling $file"
            typst compile "$file"
          done
      - name: Tag release commit
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: main-*.pdf
          tag_name: ${{ needs.prepare_release.outputs.version }}
          name: ${{ needs.prepare_release.outputs.version }}
          body: ${{ needs.extract_release_notes.outputs.release_notes }}
